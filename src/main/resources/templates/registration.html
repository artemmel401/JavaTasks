<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Кинотека</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-box {
            background: white;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            margin-bottom: 40px;
        }

        .logo h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 16px;
        }

        .message {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-weight: 500;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:hover {
            border-color: #a5b4fc;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .login-link {
            margin-top: 30px;
            color: #666;
            font-size: 15px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .back-home a {
            color: #764ba2;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .registration-box {
                padding: 30px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="registration-box">
    <!-- Логотип -->
    <div class="logo">
        <h1>🎬 Кинотека</h1>
        <p>Создайте новую учетную запись</p>
    </div>

    <!-- Сообщение -->
    <div class="message" th:if="${message}" th:classappend="${error} ? 'error' : ''">
        <span th:text="${message}"></span>
    </div>

    <!-- Форма регистрации -->
    <form id="registrationForm" th:action="@{/api/auth/register}" method="post">

        <div class="form-group">
            <label for="firstName">Имя</label>
            <input type="text"
                   id="firstName"
                   name="firstName"
                   placeholder="Введите ваше имя"
                   required>
        </div>
        <div class="form-group">
            <label for="lastName">Фамилия</label>
            <input type="text"
                   id="lastName"
                   name="lastName"
                   placeholder="Введите вашу Фамилию"
                   required>
        </div>
        <!-- Поле email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text"
                   id="email"
                   name="email"
                   placeholder="Введите ваш email"
                   required>
        </div>

        <!-- Поле пароля -->
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Введите пароль"
                   required>
        </div>

        <!-- Кнопка регистрации -->
        <button type="submit" class="submit-btn">
            Создать аккаунт
        </button>
    </form>

    <!-- Ссылка на вход -->
    <div class="login-link">
        Уже есть аккаунт?
        <a th:href="@{/login}">Войти</a>
    </div>

    <!-- Ссылка на главную -->
    <div class="back-home">
        <a th:href="@{/}">← Вернуться на главную</a>
    </div>
</div>
<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const jsonData = {};

    // Конвертируем FormData в JSON
    formData.forEach((value, key) => {
        jsonData[key] = value;
    });

    fetch(this.action, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(jsonData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Редирект при успехе
            window.location.href = data.redirectUrl || '/login?registered=true';
        } else {
            // Показываем ошибку
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorMessage').textContent = data.message;
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('errorMessage').textContent = 'Ошибка сети';
    });
});
</script>
</body>
</html>
