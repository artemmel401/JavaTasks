<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .admin-container {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .sidebar {
            background-color: #343a40;
            color: white;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, .8);
            padding: 12px 20px;
            margin: 2px 0;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, .1);
        }

        .sidebar .nav-link i {
            margin-right: 10px;
        }

        .tab-content {
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .table-actions {
            white-space: nowrap;
        }

        .badge-active {
            background-color: #198754;
        }

        .badge-inactive {
            background-color: #6c757d;
        }

        .badge-payed {
            background-color: #198754;
        }

        .badge-pending {
            background-color: #ffc107;
            color: #000;
        }

        .badge-failed {
            background-color: #dc3545;
        }

        .entity-count {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .status-badge {
            font-size: 0.75em;
            padding: 3px 8px;
        }

        .poster-thumbnail {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Стили для модалки добавления кинотеатра */
        #addCinemaModal .modal-content {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #198754;
        }

        #addCinemaModal .modal-header {
            border-radius: 10px 10px 0 0;
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        }

        #addCinemaModal .form-control:focus,
        #addCinemaModal .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }

        #addCinemaModal .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        #addCinemaModal .form-text {
            font-size: 0.875rem;
            color: #6c757d;
        }

        #addCinemaModal textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        #addCinemaModal .card {
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }

        #addCinemaModal .card-title {
            color: #198754;
            font-size: 1rem;
        }

        /* Анимации */
        #addCinemaModal .modal-content {
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #cinemaAlert {
            animation: alertFadeIn 0.3s ease-out;
        }

        @keyframes alertFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Стили для модалки редактирования кинотеатра */
        #editCinemaModal .modal-content {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #ffc107;
        }

        #editCinemaModal .modal-header {
            border-radius: 10px 10px 0 0;
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        }

        #editCinemaModal .form-control:focus,
        #editCinemaModal .form-select:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }

        #editCinemaModal .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        #editCinemaModal .card {
            border: 1px solid #ffc107;
            background: linear-gradient(135deg, #fff9db 0%, #fff3bf 100%);
        }

        #editCinemaModal .card .text-muted {
            font-size: 0.8rem;
            color: #664d03;
        }

        #editCinemaModal .card .fw-bold {
            color: #664d03;
        }

        /* Анимации */
        #editCinemaModal .modal-content {
            animation: modalSlideInEdit 0.3s ease-out;
        }

        @keyframes modalSlideInEdit {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #editCinemaAlert {
            animation: alertFadeIn 0.3s ease-out;
        }

        /* Индикатор изменений */
        .form-control.changed {
            border-color: #ffc107;
            background-color: #fff9db;
        }

        .form-control.changed:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.5);
        }
    </style>
</head>

<body>
    <div class="container-fluid admin-container">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-flex flex-column align-items-center mb-4">
                    <h4 class="text-center mb-3">Админ-панель</h4>
                </div>

                <nav class="nav flex-column">
                    <a class="nav-link" href="/admin/users">
                        <i class="bi bi-people"></i> Пользователи
                    </a>
                    <a class="nav-link" href="/admin/movies">
                        <i class="bi bi-film"></i> Фильмы
                    </a>
                    <a class="nav-link" href="/admin/sessions">
                        <i class="bi bi-clock"></i> Сеансы
                    </a>
                    <a class="nav-link" href="/admin/cinemas">
                        <i class="bi bi-building"></i> Кинотеатры
                    </a>
                    <a class="nav-link active" href="/admin/halls">
                        <i class="bi bi-building"></i> Залы
                    </a>
                    <a class="nav-link" href="/admin/bookings">
                        <i class="bi bi-ticket"></i> Бронирования
                    </a>
                    <a class="nav-link" href="/cabinet">
                        В личный кабинет
                    </a>
                </nav>
            </div>

            <!-- Main content -->
            <div class="col-md-9 col-lg-10 ml-sm-auto pt-3 px-4">
                <div class="tab-content">
                    <div id="cinemasTab">
                        <h3 class="mb-4">
                            <i class="bi bi-building text-primary me-2"></i>Управление залами
                        </h3>

                        <button class="btn btn-primary mb-3" onclick="showAddHallPopup()">
                            <i class="bi bi-plus-circle"></i> Добавить зал
                        </button>

                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Название</th>
                                        <th>Мест в ряду</th>
                                        <th>Рядов</th>
                                        <th>Кинотеатр</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="hall : ${halls}">
                                        <td th:text="${hall.id}"></td>
                                        <td th:text="${hall.name}"></td>
                                        <td th:text="${hall.seatsPerRow}"></td>
                                        <td th:text="${hall.totalRows}"></td>
                                        <td th:text="${hall.cinema.name}"></td>
                                        <td class="table-actions">
                                            <button class="btn btn-sm btn-outline-danger ms-1"
                                                th:onclick="'deleteHall(' + ${hall.id} + ')'">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal для создания нового зала -->
    <div class="modal fade" id="addHallModal" tabindex="-1" aria-labelledby="addHallModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addHallModalLabel">Создание нового зала</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addHallForm">
                        <!-- Поле для названия зала -->
                        <div class="mb-3">
                            <label for="hallName" class="form-label">Название зала</label>
                            <input type="text" class="form-control" id="hallName" name="name"
                                placeholder="Например: Зал 1" required>
                            <div class="form-text">Укажите уникальное название для зала</div>
                        </div>

                        <!-- Поле для количества мест в ряду -->
                        <div class="mb-3">
                            <label for="seatsPerRow" class="form-label">Количество мест в ряду</label>
                            <input type="number" class="form-control" id="seatsPerRow" name="seatsPerRow" min="1"
                                max="100" value="50" required>
                            <div class="form-text">Количество мест в одном ряду (макс. 100)</div>
                        </div>

                        <!-- Поле для количества рядов -->
                        <div class="mb-3">
                            <label for="totalRows" class="form-label">Количество рядов</label>
                            <input type="number" class="form-control" id="totalRows" name="totalRows" min="1" max="50"
                                value="148" required>
                            <div class="form-text">Общее количество рядов в зале (макс. 50)</div>
                        </div>

                        <!-- Поле для выбора кинотеатра (если нужно) -->
                        <div class="mb-3">
                            <label for="cinemaId" class="form-label">Кинотеатр</label>
                            <select class="form-select" id="cinemaId" name="cinema_id" required>
                                <!-- Опции будут заполняться динамически -->
                                <option value="" selected disabled>Выберите кинотеатр</option>
                                <!-- Пример опций -->
                                <option value="1">Кинотеатр 1</option>
                                <option value="2">Кинотеатр 2</option>
                                <option value="3">Кинотеатр 3</option>
                            </select>
                        </div>

                        <!-- Скрытые поля или дополнительные настройки -->
                        <input type="hidden" id="hallId" name="id" value="">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveHall()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>


        function showNotification(message, type = 'info') {
            // Ваша реализация показа уведомлений
            alert(`${type.toUpperCase()}: ${message}`);
        }
        function deleteHall(hallId) {
            if (confirm('Вы уверены, что хотите удалить зал?')) {
                fetch(`/api/admin/hall/${hallId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                })
                    .then(response => {
                        if (response.ok) {
                            location.reload()
                        } else {
                            throw new Error('Ошибка при сохранении изменений');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Произошла ошибка при сохранении изменений');
                    });
            }
        }
        function showAddHallPopup(hallId = null) {
            const modal = new bootstrap.Modal(document.getElementById('addHallModal'));
            const form = document.getElementById('addHallForm');
            const modalTitle = document.getElementById('addHallModalLabel');

            // Сброс формы
            form.reset();

            if (hallId) {
                // Режим редактирования
                modalTitle.textContent = 'Редактирование зала';
                document.getElementById('hallId').value = hallId;

                // Загрузка данных зала для редактирования
                fetch(`/api/admin/hall/${hallId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                })
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        } else {
                            throw new Error('Ошибка при загрузке данных');
                        }
                    })
                    .then(data => {
                        // Заполняем форму данными
                        document.getElementById('hallName').value = data.name || '';
                        document.getElementById('seatsPerRow').value = data.seatsPerRow || 50;
                        document.getElementById('totalRows').value = data.totalRows || 148;
                        document.getElementById('cinemaId').value = data.cinema_id || '';
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Произошла ошибка при загрузке данных зала');
                    });
            } else {
                // Режим создания нового зала
                modalTitle.textContent = 'Создание нового зала';
                document.getElementById('hallId').value = '';

                // Установка значений по умолчанию
                document.getElementById('seatsPerRow').value = 50;
                document.getElementById('totalRows').value = 148;
            }

            modal.show();
        }
        // Функция для сохранения зала
        function saveHall() {
            const form = document.getElementById('addHallForm');
            const hallId = document.getElementById('hallId').value;

            // Собираем данные из формы
            const formData = {
                name: document.getElementById('hallName').value,
                seatsPerRow: parseInt(document.getElementById('seatsPerRow').value),
                totalRows: parseInt(document.getElementById('totalRows').value),
                cinema_id: document.getElementById('cinemaId').value
            };

            // Валидация
            if (!formData.name || !formData.seatsPerRow || !formData.totalRows || !formData.cinema_id) {
                alert('Пожалуйста, заполните все обязательные поля');
                return;
            }

            // Определяем URL и метод в зависимости от режима (создание/редактирование)
            const url = hallId ? `/api/admin/hall/${hallId}` : '/api/admin/hall';
            const method = hallId ? 'PATCH' : 'POST';

            // Отправляем запрос
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify(formData)
            })
                .then(response => {
                    if (response.ok) {
                        // Закрываем модальное окно
                        const modal = bootstrap.Modal.getInstance(document.getElementById('addHallModal'));
                        modal.hide();

                        // Обновляем страницу или таблицу с залами
                        location.reload();
                    } else {
                        return response.json().then(err => {
                            throw new Error(err.message || 'Ошибка при сохранении зала');
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert(error.message || 'Произошла ошибка при сохранении зала');
                });
        }

        // Дополнительно: функция для загрузки списка кинотеатров
        function loadCinemas() {
            fetch('/api/cinema', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
            })
                .then(response => response.json())
                .then(cinemas => {
                    const select = document.getElementById('cinemaId');
                    select.innerHTML = '<option value="" selected disabled>Выберите кинотеатр</option>';

                    cinemas.forEach(cinema => {
                        const option = document.createElement('option');
                        option.value = cinema.id;
                        option.textContent = cinema.name;
                        select.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading cinemas:', error);
                });
        }

        // Загружаем кинотеатры при загрузке страницы (если нужно)
        document.addEventListener('DOMContentLoaded', function () {
            loadCinemas(); // Раскомментировать, если нужна динамическая загрузка кинотеатров
        });
    </script>
</body>

</html>
