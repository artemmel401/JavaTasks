<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .admin-container {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .sidebar {
            background-color: #343a40;
            color: white;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, .8);
            padding: 12px 20px;
            margin: 2px 0;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, .1);
        }

        .sidebar .nav-link i {
            margin-right: 10px;
        }

        .tab-content {
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .table-actions {
            white-space: nowrap;
        }

        .badge-active {
            background-color: #198754;
        }

        .badge-inactive {
            background-color: #6c757d;
        }

        .badge-payed {
            background-color: #198754;
        }

        .badge-pending {
            background-color: #ffc107;
            color: #000;
        }

        .badge-failed {
            background-color: #dc3545;
        }

        .entity-count {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .status-badge {
            font-size: 0.75em;
            padding: 3px 8px;
        }

        .poster-thumbnail {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container-fluid admin-container">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="d-flex flex-column align-items-center mb-4">
                <h4 class="text-center mb-3">Админ-панель</h4>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link" href="/admin/users">
                    <i class="bi bi-people"></i> Пользователи
                </a>
                <a class="nav-link" href="/admin/movies">
                    <i class="bi bi-film"></i> Фильмы
                </a>
                <a class="nav-link" href="/admin/sessions">
                    <i class="bi bi-clock"></i> Сеансы
                </a>
                <a class="nav-link" href="/admin/cinemas">
                    <i class="bi bi-building"></i> Кинотеатры
                </a>
                <a class="nav-link" href="/admin/halls">
                    <i class="bi bi-building"></i> Залы
                </a>
                <a class="nav-link active" href="/admin/bookings">
                    <i class="bi bi-ticket"></i> Бронирования
                </a>
                <a class="nav-link" href="/cabinet">
                    В личный кабинет
                </a>
            </nav>
        </div>

        <!-- Main content -->
        <div class="col-md-9 col-lg-10 ml-sm-auto pt-3 px-4">
            <div class="tab-content">
                <div id="bookingsTab">
                    <h3 class="mb-4">
                        <i class="bi bi-ticket text-primary me-2"></i>Управление бронированиями
                    </h3>

                    <div class="d-flex justify-content-between mb-3">
                        <div class="d-flex align-items-center">
                            <span class="me-2">Статус оплаты:</span>
                            <select class="form-select form-select-sm w-auto" onchange="filterBookings(this)">
                                <option value="all">Все</option>
                                <option value="PAID">Оплачено</option>
                                <option value="PENDING">В ожидании</option>
                                <option value="FAILED">Неудача</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Пользователь</th>
                                <th>Сеанс</th>
                                <th>Время бронирования</th>
                                <th>Сумма</th>
                                <th>Статус оплаты</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td th:text="${booking.id}"></td>
                                <td th:text="${booking.user?.email}"></td>
                                <td th:text="${booking.session?.movie?.title}"></td>
                                <td th:text="${#temporals.format(booking.bookingTime, 'dd.MM.yyyy HH:mm')}">
                                </td>
                                <td th:text="${booking.totalAmount} + ' ₽'"></td>
                                <td>
                                            <span class="badge status-badge" th:if="${booking.paymentStatus != null}"
                                                  th:classappend="'badge-' + ${#strings.toLowerCase(booking.paymentStatus.name())}"
                                                  th:text="${booking.paymentStatus.name() == 'PAYED' ? 'ОПЛАЧЕНО' :
                   booking.paymentStatus.name() == 'PENDING' ? 'ОЖИДАНИЕ' :
                   'ОТМЕНЕНО'}">
                                            </span>
                                    <span th:unless="${booking.paymentStatus != null}"
                                          class="badge badge-secondary status-badge">
                                                НЕ УКАЗАН
                                            </span>
                                </td>
                                <td class="table-actions">
                                    <button class="btn btn-sm btn-outline-danger ms-1"
                                            th:onclick="'deleteBooking(' + ${booking.id} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function showNotification(message, type = 'info') {
        // Ваша реализация показа уведомлений
        alert(`${type.toUpperCase()}: ${message}`);
    }

    function filterBookings(select) {
        const status = select.value;
        const rows = document.querySelectorAll('#bookingsTab tbody tr');

        rows.forEach(row => {
            const statusBadge = row.querySelector('.badge');
            const statusText = statusBadge ? statusBadge.textContent.trim() : '';
            const statusMap = {
                'Оплачено': 'PAYED',
                'В ожидании': 'PENDING',
                'Неудача': 'FAILED'
            };

            if (status === 'all' ||
                (status === 'PAYED' && statusText === 'Оплачено') ||
                (status === 'PENDING' && statusText === 'В ожидании') ||
                (status === 'FAILED' && statusText === 'Неудача')) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    function deleteBooking(bookingId) {
        if (confirm('Вы уверены, что хотите удалить бронирование?')) {
            fetch(`/api/booking/${bookingId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
            })
                .then(response => {
                    if (response.ok) {
                        location.reload()
                    } else {
                        throw new Error('Ошибка при сохранении изменений');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Произошла ошибка при сохранении изменений');
                });
        }
    }
</script>
</body>
</html>
