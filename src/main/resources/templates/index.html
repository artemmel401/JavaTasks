<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User List</title>
</head>
<body>
<h1>User List</h1>
<form th:action="@{/logout}" method="post" style="margin-bottom: 20px;">
    <input id="logout" type="submit" value="Выйти из системы" style="
        background-color: #f44336;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;">
</form>
<table border="1">
    <tr>
        <th>ID</th>
        <th>email</th>
        <th>first_name</th>
        <th>last_name</th>
        <th>isActive</th>
        <th>registration_date</th>
        <th>role</th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.isActive}"></td>
        <td th:text="${user.registrationDate}"></td>
        <td th:text="${user.role}"></td>
    </tr>
</table>
</body>
</html>
